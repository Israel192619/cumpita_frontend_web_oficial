<div class="topbar">
  <div class="topbar-start">
    <button class="icon-button menu-button" type="button" aria-label="Abrir o contraer menú" (click)="menuToggle.emit()">
      <app-icon name="menu" [size]="20" />
    </button>
  </div>

  <div class="topbar-actions">
    @if (canOpenPos()) {
      <a class="icon-button" routerLink="/pos" title="Abrir POS" aria-label="Abrir POS">
        <app-icon name="shopping-cart" [size]="20" />
      </a>
    }
    @if (canOpenKds()) {
      <a class="icon-button" [routerLink]="kdsRoute()" title="Abrir KDS" aria-label="Abrir KDS">
        <app-icon name="restaurant" [size]="20" />
      </a>
    }
    <button class="icon-button" type="button" (click)="themeToggle.emit()" [attr.aria-label]="theme === 'dark' ? 'Usar tema claro' : 'Usar tema oscuro'" [title]="theme === 'dark' ? 'Tema claro' : 'Tema oscuro'">
      @if (theme === 'dark') {
        <app-icon name="sun" [size]="20" />
      } @else {
        <app-icon name="moon" [size]="20" />
      }
    </button>

    @if (!enServicio()) {
      <div class="user-menu">
        <button class="user-button" type="button" (click)="userMenuOpen.update(open => !open)" [attr.aria-expanded]="userMenuOpen()">
          <span class="user-copy"><b>{{ user()?.name || 'Usuario' }}</b><small>{{ user()?.role?.nombre || '' }}</small></span>
          <span class="avatar">@if (avatarUrl()) { <img [src]="avatarUrl()!" alt="" /> } @else { <app-icon name="user" [size]="23" /> }</span>
        </button>
        @if (userMenuOpen()) {
          <div class="user-dropdown" role="menu">
            <a routerLink="/app/perfil" class="profile-button" role="menuitem" (click)="userMenuOpen.set(false)"><app-icon name="user" [size]="21" /><span>Mi perfil</span></a>
            <button type="button" class="logout-button" role="menuitem" (click)="logout()"><app-icon name="log-out" [size]="21" /><span>Cerrar sesión</span></button>
          </div>
        }
      </div>
    }
  </div>
</div>
