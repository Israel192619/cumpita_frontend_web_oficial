<div class="topbar">
  <div class="topbar-start">
    <button class="icon-button menu-button" type="button" aria-label="Abrir o contraer menú" (click)="menuToggle.emit()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <label class="search-box">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input type="search" placeholder="Buscar…" aria-label="Buscar">
      <kbd>Ctrl K</kbd>
    </label>
  </div>

  <div class="topbar-actions">
    @if (!esSoloServicio()) {
      <a class="icon-button" routerLink="/pos" title="Abrir POS" aria-label="Abrir POS">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2l2 10h10l2-7H6M9 20h.01M17 20h.01"/></svg>
      </a>
      <a class="icon-button" routerLink="/app/kds" title="Abrir KDS" aria-label="Abrir KDS">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v7M10 3v7M6 7h4M8 10v11M16 3c-2 3-2 7 1 9v9"/></svg>
      </a>
    }
    <button class="icon-button" type="button" (click)="themeToggle.emit()" [attr.aria-label]="theme === 'dark' ? 'Usar tema claro' : 'Usar tema oscuro'" [title]="theme === 'dark' ? 'Tema claro' : 'Tema oscuro'">
      @if (theme === 'dark') {
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A9 9 0 0 1 8.5 3.5a9 9 0 1 0 12 12Z"/></svg>
      }
    </button>

    @if (!enServicio()) {
      <div class="user-menu">
        <button class="user-button" type="button" (click)="userMenuOpen.update(open => !open)" [attr.aria-expanded]="userMenuOpen()">
          <span class="avatar">{{ initials() }}</span><span class="user-copy"><b>{{ user()?.name || 'Usuario' }}</b><small>{{ user()?.role?.nombre || '' }}</small></span><span class="caret">⌄</span>
        </button>
        @if (userMenuOpen()) {
          <button class="menu-scrim" type="button" aria-label="Cerrar menú de usuario" (click)="userMenuOpen.set(false)"></button>
          <div class="user-dropdown">
            <div class="dropdown-profile"><span class="avatar large">{{ initials() }}</span><div><b>{{ user()?.name }}</b><small>{{ user()?.email }}</small></div></div>
            <button type="button" class="logout-button" (click)="logout()"><span>↪</span>Cerrar sesión</button>
          </div>
        }
      </div>
    }
  </div>
</div>
