<div class="sidebar-shell" [class.is-collapsed]="collapsed">
  <a class="brand" routerLink="/app" (click)="selectLink()" aria-label="Inicio Toñito">
    <span class="brand-mark">T</span>
    <span class="brand-copy"><b>Toñito</b><small>Restaurante</small></span>
  </a>

  <nav class="nav-list">
    @if (esSoloServicio() === true) {
      <a class="nav-link" routerLink="/app/servicio" routerLinkActive="active" (click)="selectLink()">
        <span class="nav-icon">S</span><span class="nav-label">Servicio</span>
      </a>
    } @else if (esSoloServicio() === false) {
      <p class="nav-caption">Principal</p>
      <a class="nav-link" routerLink="/app" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active" (click)="selectLink()">
        <span class="nav-icon">D</span><span class="nav-label">Dashboard</span>
      </a>
      <p class="nav-caption">Administración</p>
      @for (group of groups; track group.key) {
        <section class="nav-group" [class.open]="expanded() === group.key">
          <button type="button" class="nav-link group-trigger" (click)="toggleGroup(group.key)" [attr.aria-expanded]="expanded() === group.key">
            <span class="nav-icon">{{ group.icon }}</span><span class="nav-label">{{ group.label }}</span><span class="chevron">›</span>
          </button>
          <div class="submenu">
            @for (child of group.children; track child.route) {
              <a [routerLink]="child.route" routerLinkActive="active" class="submenu-link" (click)="selectLink()">{{ child.label }}</a>
            }
          </div>
        </section>
      }
    }
  </nav>
  <div class="sidebar-version"><span>TV</span><small>Toñito v1</small></div>
</div>
