<div class="app-shell" [class.sidebar-collapsed]="sidebarCollapsed()" [class.sidebar-open]="mobileSidebarOpen()">
  <aside class="app-sidebar" aria-label="Navegación principal">
    <app-sidebar [collapsed]="sidebarCollapsed()" (linkSelected)="closeMobileSidebar()"></app-sidebar>
  </aside>
  @if (mobileSidebarOpen()) {
    <button class="sidebar-backdrop" type="button" aria-label="Cerrar menú" (click)="closeMobileSidebar()"></button>
  }
  <header class="app-header">
    <app-header [theme]="themeService.theme()" (menuToggle)="toggleSidebar()" (themeToggle)="themeService.toggle()"></app-header>
  </header>
  <main class="app-main"><div class="app-content"><router-outlet></router-outlet></div></main>
  <footer class="app-footer"><app-footer></app-footer></footer>
</div>
