<div class="field" [class.field-error]="invalid">
  @if (label) { <label [for]="id">{{ label }}@if (required) { <span aria-hidden="true">*</span> }</label> }
  <div class="select-wrap">
    @if (control) {
      <select [id]="id" [formControl]="control" [required]="required" [attr.aria-invalid]="invalid" [attr.aria-describedby]="describedBy" (ngModelChange)="selectionChange.emit($event)">
        <option [ngValue]="null" [disabled]="required">{{ placeholder }}</option>
        @for (option of options; track option.value) { <option [ngValue]="option.value" [disabled]="option.disabled">{{ option.label }}</option> }
      </select>
    } @else {
      <select [id]="id" [ngModel]="value" (ngModelChange)="onChange($event)" [disabled]="disabled" [required]="required" [attr.aria-invalid]="invalid" [attr.aria-describedby]="describedBy">
        <option [ngValue]="null" [disabled]="required">{{ placeholder }}</option>
        @for (option of options; track option.value) { <option [ngValue]="option.value" [disabled]="option.disabled">{{ option.label }}</option> }
      </select>
    }
    <span class="chevron" aria-hidden="true"></span>
  </div>
  @if (validationMessage(); as message) { <small class="field-message error" [id]="id + '-error'" role="alert">{{ message }}</small> }
  @else if (helpText) { <small class="field-message" [id]="id + '-help'">{{ helpText }}</small> }
</div>
