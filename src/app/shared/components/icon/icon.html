<svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  [style.width]="cssSize"
  [style.height]="cssSize"
  [attr.aria-hidden]="label ? null : 'true'"
  [attr.aria-label]="label"
  [attr.role]="label ? 'img' : null"
  focusable="false"
>
  @switch (iconName) {
    @case ('arrow-down-right-circle') { <circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-5v5h-5"/> }
    @case ('arrow-up-right-circle') { <circle cx="12" cy="12" r="9"/><path d="m9 15 6-6m-5 0h5v5"/> }
    @case ('chevron-down') { <path d="m6 9 6 6 6-6"/> }
    @case ('chevron-right') { <path d="m9 6 6 6-6 6"/> }
    @case ('chevron-up') { <path d="m6 15 6-6 6 6"/> }
    @case ('clock') { <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/> }
    @case ('coin') { <circle cx="12" cy="12" r="9"/><path d="M14.5 8.5h-4a2 2 0 0 0 0 4h3a2 2 0 0 1 0 4h-4M12 6.5v11"/> }
    @case ('credit-card') { <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/> }
    @case ('dots') { <circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/> }
    @case ('edit') { <path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/> }
    @case ('eye') { <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/> }
    @case ('eye-off') { <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61M2 2l20 20"/> }
    @case ('qrcode') { <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v4h-2zM14 18h4v2h-4z"/> }
    @case ('shopping-cart') { <path d="M3 4h2l2 11h10l2-7H6"/><circle cx="9" cy="19" r="1"/><circle cx="17" cy="19" r="1"/> }
    @case ('trash') { <path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/> }
    @case ('trending-up') { <path d="m3 17 6-6 4 4 7-8M15 7h5v5"/> }
    @case ('wallet') { <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H18v4H6.5a2.5 2.5 0 0 0 0 5H20v7H6a2 2 0 0 1-2-2V6.5Z"/><path d="M20 9v4h-4a2 2 0 0 1 0-4h4Z"/> }
  }
</svg>
