<div class="card">
    <div class="header">
        <h2>{{ title }}</h2>
        <div class="actions">
            <app-button 
                *ngIf="createLink" 
                [link]="createLink" 
                text="+ Crear"
                color="primary"
                size="medium">
            </app-button>
            <app-button 
                text="Recargar"
                color="dark"
                size="medium"
                (click)="refresh.emit()">
            </app-button>
        </div>
    </div>
    <app-loader [loading]="loading"></app-loader>
    <app-error-message *ngIf="!loading" [message]="error" [linkRedireccion]="errorMessageLink"
        [linkTexto]="errorMessageText"></app-error-message>

    <div class="table-container">
        <table *ngIf="!loading && data.length && !error" class="table">
            <thead>
                <tr>
                    <th *ngFor="let col of columns">
                        {{ col.label }}
                    </th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of data">
                    <td *ngFor="let col of columns">
                        <ng-container [ngSwitch]="col.type">

                            <div *ngSwitchCase="'image'" class="avatar-cell">
                                <img [src]="getValue(item, col.key)" class="avatar-img" />
                            </div>

                            <span *ngSwitchCase="'date'">
                                {{ getValue(item, col.key) | date:'short' }}
                            </span>

                            <span *ngSwitchDefault>
                                {{ getValue(item, col.key) }}
                            </span>

                        </ng-container>
                    </td>
                    <td class="actions-cell">
                        <div class="actions-buttons">
                            <button class="action-btn action-btn--edit" (click)="action.emit({type:'edit', item})"
                                title="Editar">
                                <i class="ti ti-edit"></i>
                            </button>

                            <button class="action-btn action-btn--view" (click)="action.emit({type:'view', item})"
                                title="Ver">
                                <i class="ti ti-eye"></i>
                            </button>

                            <button class="action-btn action-btn--delete" (click)="action.emit({type:'delete', item})"
                                title="Eliminar">
                                <i class="ti ti-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div *ngIf="!loading && !data.length && !error" class="sinDatos">

        <div class="icon">
            <svg viewBox="0 0 64 64" fill="none">
                <rect x="8" y="16" width="48" height="32" rx="8" fill="#e0e7ff" />
                <path d="M16 24h32M16 32h20" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
            </svg>
        </div>

        <span>No hay datos para mostrar.</span>
    </div>
</div>
