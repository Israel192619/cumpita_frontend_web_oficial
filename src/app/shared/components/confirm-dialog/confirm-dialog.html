<div class="dialog-container">
  <div class="dialog-accent"
    [class.primary]="data.confirmColor === 'primary'"
    [class.success]="data.confirmColor === 'success'"
    [class.warning]="data.confirmColor === 'warning'"
    [class.danger]="!data.confirmColor || data.confirmColor === 'danger'"></div>

  <div class="dialog-header">
    <span class="dialog-icon"
      [class.primary]="data.confirmColor === 'primary'"
      [class.success]="data.confirmColor === 'success'"
      [class.warning]="data.confirmColor === 'warning'"
      [class.danger]="!data.confirmColor || data.confirmColor === 'danger'">!</span>
    <div>
      <small>CONFIRMACIÓN</small>
      <h2>{{ data.title }}</h2>
    </div>
  </div>

  <p class="content">{{ data.message }}</p>

  <div class="actions">
    <button type="button" class="cancel-button" (click)="onCancel()">
      {{ data.cancelText || 'Cancelar' }}
    </button>
    <button type="button" class="confirm-button" (click)="onConfirm()"
      [class.primary]="data.confirmColor === 'primary'"
      [class.success]="data.confirmColor === 'success'"
      [class.warning]="data.confirmColor === 'warning'"
      [class.danger]="!data.confirmColor || data.confirmColor === 'danger'">
      {{ data.confirmText || 'Confirmar' }}
    </button>
  </div>
</div>
