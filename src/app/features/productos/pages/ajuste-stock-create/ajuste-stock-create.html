<app-form-card [form]="form" title="Registrar ajuste de stock" [loading]="loading()" (submit)="guardar()" (cancelar)="cancelar()">
  <p class="adjustment-intro">Elige un producto o una opción con stock, el tipo y la cantidad. El sistema guarda el cambio automáticamente.</p>
  <div class="adjustment-field">
    <label for="producto">Producto u opción de modificador</label>
    <select id="producto" [formControl]="control('destino')" [disabled]="loadingProducts()">
      <option [ngValue]="null">{{ loadingProducts() ? 'Cargando inventario…' : 'Selecciona un elemento' }}</option>
      <optgroup label="Productos">@for (producto of productos(); track producto.id) { <option [value]="'producto:' + producto.id">{{ producto.nombre }} — Stock: {{ producto.stock }}</option> }</optgroup>
      <optgroup label="Opciones de modificadores">@for (opcion of opciones(); track opcion.id) { <option [value]="'opcion:' + opcion.id">{{ opcion.grupo }} / {{ opcion.nombre }} — Stock: {{ opcion.stock }}</option> }</optgroup>
    </select>
  </div>
  <div class="adjustment-field">
    <label for="tipo">Tipo de ajuste</label>
    <select id="tipo" [formControl]="control('tipo')">
      <option value="ENTRADA">Entrada / reabastecimiento</option><option value="SALIDA">Salida / merma o daño</option><option value="CORRECCION">Corrección por conteo físico</option>
    </select>
  </div>
  <div class="adjustment-field"><app-input-form [label]="labelCantidad()" type="number" [control]="control('cantidad')" [placeholder]="tipo() === 'CORRECCION' ? '0' : '1'"></app-input-form><small>{{ ayudaCantidad() }}</small></div>
  <div class="adjustment-field"><app-input-form label="Motivo (opcional)" [control]="control('motivo')" placeholder="Ej.: llegada de proveedor o producto vencido"></app-input-form></div>
</app-form-card>
<app-error-message [message]="error()"></app-error-message>
