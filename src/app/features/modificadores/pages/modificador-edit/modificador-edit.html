<app-form-card [form]="form" [loading]="loading()" title="Editar modificador" [esEdicion]="true"
  (submit)="editarModificador()" (cancelar)="cancelar()">
  <div class="modifier-form">
    <section class="form-section">
      <div class="section-heading"><span class="section-number">1</span><div><h3>Información general</h3></div><button type="button" class="help-trigger" aria-label="Ayuda sobre estación de trabajo"><span>?</span><span class="help-tooltip">Elige una estación solo si esta opción requiere trabajo adicional allí. “Sin estación” acompaña al producto, sin crear otra tarea.</span></button></div>
      <div class="field-grid">
        <app-input-form label="Nombre del modificador" [control]="getControl('nombre')" placeholder="Ej. Tamaño, punto de cocción, aderezo"></app-input-form>
        <app-select label="Estación de trabajo" [control]="getControl('estacion_id')" [options]="estacionOptions"></app-select>
        <label class="modifier-color-field"><span>Color de fondo en POS y Servicio</span><div><input type="color" [formControl]="getControl('color_fondo')"><output [style.background]="getControl('color_fondo').value">{{ getControl('color_fondo').value }}</output></div><small>Se aplicará a todas las opciones de este modificador.</small></label>
      </div>
    </section>
    <section class="form-section">
      <div class="section-heading"><span class="section-number">2</span><div><h3>Comportamiento</h3></div><button type="button" class="help-trigger" aria-label="Ayuda sobre tipo de selección"><span>?</span><span class="help-tooltip">Selección única permite elegir una opción; selección múltiple permite elegir varias.</span></button></div>
      <div class="behavior-grid">
        <app-select label="Tipo de selección" [control]="getControl('tipo')" [options]="[{ label: 'Selección única', value: 'unico' }, { label: 'Selección múltiple', value: 'multiple' }]"></app-select>
        <label class="toggle-card"><input type="checkbox" [formControl]="getControl('requerido')"><span><strong>Obligatorio</strong><small>El cajero debe elegir una opción.</small></span></label>
        <label class="toggle-card"><input type="checkbox" [formControl]="getControl('activo')"><span><strong>Activo</strong></span></label>
      </div>
    </section>
    <section class="form-section options-section">
      <div class="section-heading options-heading"><span class="section-number">3</span><div><h3>Opciones disponibles</h3></div><button type="button" class="help-trigger" aria-label="Ayuda sobre opciones"><span>?</span><span class="help-tooltip">Cada opción puede tener un precio adicional y desactivarse temporalmente sin eliminarla.</span></button></div>
      <div [formArray]="opcionesForm" class="options-list">
        <div *ngFor="let opcion of opcionesForm.controls; let i = index" [formGroupName]="i" class="option-card">
          <div class="option-header"><div><span class="option-index">{{ i + 1 }}</span><strong>Opción {{ i + 1 }}</strong></div><button type="button" class="btn-remove" [disabled]="opcionesForm.length === 1" (click)="eliminarOpcion(i)"><app-icon name="trash" [size]="16"/> Eliminar</button></div>
          <div class="option-fields">
            <app-input-form label="Nombre visible" [control]="getOpcionControl(i, 'nombre')" placeholder="Ej. Grande, Extra queso"></app-input-form>
            <app-input-form [label]="'Precio adicional (' + currencySymbol + ')'" type="number" [control]="getOpcionControl(i, 'precio_extra')" placeholder="0.00"></app-input-form>
            <div class="option-image-field">
              <app-input-form label="Imagen de la opción" type="file" [control]="getOpcionControl(i, 'imagen')"
                [enableCamera]="true" [optimizeImage]="true" [initialPreview]="getOpcionImagenUrl(i)"
                helpText="Puedes reemplazarla o conservarla oculta para usarla después."
                (imageCleared)="marcarImagenEliminada(i)" (imageSelected)="conservarImagen(i)"></app-input-form>
              <label class="option-status option-image-toggle"><input type="checkbox" [formControl]="getOpcionControl(i, 'mostrar_imagen')"><span>Mostrar imagen en POS</span></label>
            </div>
            <label class="option-status"><input type="checkbox" [formControl]="getOpcionControl(i, 'maneja_stock')"><span>Controlar stock de esta opción</span></label>
            <app-input-form *ngIf="getOpcionControl(i, 'maneja_stock').value" label="Stock actual" type="number" [control]="getOpcionControl(i, 'stock')" placeholder="0"></app-input-form>
            <app-input-form *ngIf="getOpcionControl(i, 'maneja_stock').value" label="Stock mínimo" type="number" [control]="getOpcionControl(i, 'stock_minimo')" placeholder="0"></app-input-form>
            <label class="option-status"><input type="checkbox" [formControl]="getOpcionControl(i, 'activo')"><span>{{ getOpcionControl(i, 'activo').value ? 'Activa' : 'Inactiva' }}</span></label>
          </div>
        </div>
      </div>
      <div class="options-actions"><button type="button" class="btn-add-option" (click)="agregarOpcion()">+ Agregar opción</button></div>
    </section>
  </div>
</app-form-card>
<app-error-message [message]="error()"></app-error-message>
