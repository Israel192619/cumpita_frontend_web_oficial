<app-data-table
  title="Modificadores"
  [data]="modificadores().map(m => ({
    ...m,
    requerido: m.requerido ? 'Sí' : 'No',
    activo: m.activo ? 'Activo' : 'Inactivo'
    , estacion_nombre: m.estacion?.nombre || 'Sin estación'
  }))"
  [columns]="[
    { key: 'nombre', label: 'Nombre' },
    { key: 'tipo', label: 'Tipo' },
    { key: 'requerido', label: 'Requerido', type: 'boolean' },
    { key: 'estacion_nombre', label: 'Estación' },
    { key: 'activo', label: 'Estado', type: 'status' },
    { key: 'opciones_count', label: 'Opciones' }
  ]"
  [loading]="isloading()"
  [error]="error()"
  createLink="/app/modificadores/create"
  (refresh)="obtenerModificadores()"
  (action)="handleAction($event)"
>
</app-data-table>
