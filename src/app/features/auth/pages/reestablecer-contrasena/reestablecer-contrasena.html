<div class="login-page">
    <div class="login-card">
        <div class="brand">
            <img src="images/logo-white.svg" alt="Logo" (error)="$event.target.style.display='none'" />
            <h1>{{ nombreApp }}</h1>
            <p class="subtitle">Reestablecer Contraseña</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
            <div class="field">
                <label for="password">Contraseña</label>
                <div class="password-row">
                    <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
                        placeholder="********" />
                    <button type="button" class="btn-toggle" (click)="toggleShowPassword()"
                        aria-label="Mostrar contraseña">
                        {{ showPassword ? 'Ocultar' : 'Mostrar' }}
                    </button>
                </div>
                <div class="hint" *ngIf="form.controls['password'].touched && form.controls['password'].invalid">
                    <small *ngIf="form.controls['password'].errors?.['required']">La contraseña es requerida.</small>
                    <small *ngIf="form.controls['password'].errors?.['minlength']">Mínimo 8 caracteres.</small>
                </div>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <div class="password-row">
                    <input id="confirmPassword" [type]="showConfirmPassword ? 'text' : 'password'"
                        formControlName="confirmPassword" placeholder="********" />
                    <button type="button" class="btn-toggle" (click)="toggleShowConfirmPassword()"
                        aria-label="Mostrar contraseña">
                        {{ showConfirmPassword ? 'Ocultar' : 'Mostrar' }}
                    </button>
                </div>
                <div class="hint" *ngIf="form.get('confirmPassword')?.touched">

                    <small *ngIf="form.get('confirmPassword')?.errors?.['required']">
                        La contraseña es requerida.
                    </small>

                    <small *ngIf="form.get('confirmPassword')?.errors?.['minlength']">
                        Mínimo 8 caracteres.
                    </small>

                    <small *ngIf="form.errors?.['passwordMismatch']">
                        Las contraseñas no coinciden
                    </small>

                </div>
            </div>

            <!-- <div class="form-actions">
        <label class="remember">
          <input type="checkbox" /> Recuérdame
        </label>
      </div> -->


            <div class="submit-row">
                <button type="submit" class="btn-primary" [disabled]="loading">
                    <span *ngIf="!loading">REESTABLECER</span>
                    <span *ngIf="loading" class="loader"></span>
                </button>
            </div>

            <div class="error" *ngIf="error"><small>{{ error }}</small></div>
        </form>

        <div class="reestablecer-contrasena">
            <a [routerLink]="['/login']">Iniciar sesión</a>
        </div>
    </div>
</div>
