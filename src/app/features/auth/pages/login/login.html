<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <img src="images/logoSvgWhite2.svg" alt="Logo" (error)="$event.target.style.display='none'" />
      <h1>{{ nombreApp }}</h1>
      <p class="subtitle">Accede a tu cuenta</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <div class="field">
        <label for="email">Correo</label>
        <input id="email" type="email" formControlName="email" placeholder="tu@correo.com" />
        <div class="hint" *ngIf="form.controls['email'].touched && form.controls['email'].invalid">
          <small *ngIf="form.controls['email'].errors?.['required']">El correo es requerido.</small>
          <small *ngIf="form.controls['email'].errors?.['email']">Correo inválido.</small>
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="password-row">
          <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
            placeholder="********" />
          <button type="button" class="btn-toggle" (click)="toggleShowPassword()">
            <i class="fa-solid" [ngClass]="showPassword() ? 'fa fa-eye-slash' : 'fa fa-eye'">
            </i>
          </button>
        </div>
        <div class="hint" *ngIf="form.controls['password'].touched && form.controls['password'].invalid">
          <small *ngIf="form.controls['password'].errors?.['required']">La contraseña es requerida.</small>
          <small *ngIf="form.controls['password'].errors?.['minlength']">Mínimo 8 caracteres.</small>
        </div>
      </div>

      <!-- <div class="form-actions">
        <label class="remember">
          <input type="checkbox" /> Recuérdame
        </label>
      </div> -->


      <div class="submit-row">
        <button type="submit" class="btn-primary" [disabled]="loading()">
          <span *ngIf="!loading()">INGRESAR</span>
          <span *ngIf="loading()" class="loader"></span>
        </button>
      </div>

      <div class="error" *ngIf="error()"><small>{{ error() }}</small></div>
    </form>

    <div class="reestablecer-contrasena">
      <a [routerLink]="['/olvidaste-contrasena']">¿Olvidaste tu contraseña?</a>
    </div>
  </div>
</div>
