<app-form-card [form]="form" title="Editar Usuario" [esEdicion]="true" (submit)="editarUsuario()" (cancelar)="cancelar()">

  <app-input-form label="Nombre" [control]="getControl('name')" placeholder="Ingresa tu nombre">
  </app-input-form>

  <app-input-form label="Nombre de usuario" [control]="getControl('username')" placeholder="Ej. juan.perez">
  </app-input-form>

  <app-input-form label="Dirección" [control]="getControl('direccion')" placeholder="Av.">
  </app-input-form>

  <app-input-form label="Numero de celular" [control]="getControl('numero_celular')" placeholder="Ej. 65784***">
  </app-input-form>

  <app-input-form label="Avatar" type="file" [control]="getControl('avatar')" [initialPreview]="user()?.perfil_usuarios?.avatar_url || null">
  </app-input-form>

  <app-select label="Rol" [control]="getControl('role_id')" [options]="roles()">
  </app-select>

  <app-select label="Estación" [control]="getControl('estacion_id')" [options]="estaciones()">
  </app-select>

  <app-input-form label="Correo" [control]="getControl('email')" placeholder="ejemplo@gmail.com">
  </app-input-form>

  <app-input-form label="Contraseña" type="password" autocomplete="new-password" [control]="getControl('password')"
    placeholder="Poner solo si cambia contraseña ****">
  </app-input-form>

  @if (esRolMesero()) {
    <app-input-form label="Nuevo PIN de Servicio" type="password" [control]="getControl('pin')"
      placeholder="Déjalo vacío para conservarlo">
    </app-input-form>
  }

</app-form-card>

<app-error-message [message]="error()"></app-error-message>
