<header class="pos-toolbar">
  <div class="toolbar-brand">
    <h1>{{ mode() === 'preorden' ? 'Nueva preorden' : 'POS' }}</h1>
    <p>{{ currentDate() | date:'EEEE, MMMM d, yyyy' }}</p>
  </div>

  <div class="toolbar-actions">
    <button type="button" class="toolbar-button" (click)="backRequested.emit()">{{ backLabel() === 'Cerrar sesión' ? 'Cerrar sesión' : '← Volver' }}</button>
    <button *ngIf="mode() === 'pos'" type="button" class="toolbar-button" (click)="pendingOrdersRequested.emit()" [disabled]="isLoading()">
      Pendientes <span class="count" *ngIf="pendingOrdersCount() > 0">{{ pendingOrdersCount() }}</span>
    </button>
    <button *ngIf="mode() === 'pos'" type="button" class="toolbar-button" (click)="todayOrdersRequested.emit()" [disabled]="isLoading()">Órdenes de hoy</button>
    <button *ngIf="mode() === 'pos'" type="button" class="toolbar-button" (click)="preordersRequested.emit()" [disabled]="isLoading()">
      Preórdenes <span class="count" *ngIf="preordersCount() > 0">{{ preordersCount() }}</span>
    </button>
    <button *ngIf="mode() === 'pos' && puedeRegistrarGastos()" type="button" class="toolbar-button" (click)="gastoRequested.emit()">Registrar gasto</button>
    <button *ngIf="mode() === 'pos'" type="button" class="toolbar-button caja" [class.open]="cajaAbierta()" [class.shared]="cajaCompartida()" (click)="onCajaAction()">
      <span>{{ cajaCompartida() ? 'Caja compartida' : cajaAbierta() ? 'Caja abierta' : 'Abrir caja' }}</span>
      <small *ngIf="cajaCompartida()">Responsable: {{ cajaResponsable() }}</small>
      <small *ngIf="!cajaCompartida()">{{ cajaAbierta() ? ((cajaMontoEsperado() | appCurrency) + ' · ' + cajaPagosEfectivo() + ' pagos') : 'Efectivo desactivado' }}</small>
    </button>
    <button type="button" class="toolbar-button theme-toggle" (click)="themeToggle.emit()" [attr.aria-label]="theme() === 'dark' ? 'Usar tema claro' : 'Usar tema oscuro'" [title]="theme() === 'dark' ? 'Tema claro' : 'Tema oscuro'">
      <svg *ngIf="theme() === 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg *ngIf="theme() === 'light'" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M20.5 15.5A9 9 0 0 1 8.5 3.5a9 9 0 1 0 12 12Z"/></svg>
    </button>
    <button type="button" class="toolbar-button fullscreen" (click)="toggleFullscreen()" [attr.aria-pressed]="isFullscreen()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <path *ngIf="!isFullscreen()" d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>
        <path *ngIf="isFullscreen()" d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/>
      </svg>
      {{ isFullscreen() ? 'Salir de pantalla completa' : 'Pantalla completa' }}
    </button>
  </div>

  <label class="toolbar-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" placeholder="Buscar productos" [value]="searchValue()" (input)="onSearchInput($event)" [disabled]="isLoading()">
  </label>
</header>
