<div class="product-grid-container" [class.compact]="compact()">
  <!-- Grid de productos -->
  <div class="product-grid">
    <div
      *ngFor="let prod of productos(); trackBy: trackByProducto"
      class="product-card"
      [class.disabled]="!isProductAvailable(prod)"
      [attr.aria-disabled]="!isProductAvailable(prod) || isLoading()"
      (click)="isProductAvailable(prod) && !isLoading() ? onAddProduct(prod) : null"
    >
      <!-- Imagen circular flotante -->
      <div class="product-image-wrapper">
        <img 
          class="product-image" 
          [src]="getProductImage(prod)" 
          [alt]="prod.nombre"
        />
        <div 
          *ngIf="prod.maneja_stock && prod.stock !== undefined" 
          class="stock-badge"
          [ngClass]="{
            'stock-badge-warning': getStockState(prod) === 'warning',
            'stock-badge-empty': getStockState(prod) === 'empty',
            'stock-badge-ok': getStockState(prod) === 'ok'
          }"
        >
          {{ prod.stock }}
        </div>
      </div>

      <!-- Contenido -->
      <div class="product-content">
        <h3 class="product-name">{{ prod.nombre }}</h3>
        <p *ngIf="prod.descripcion" class="product-desc">{{ prod.descripcion }}</p>
        <div class="product-footer">
          <span *ngIf="showPrices()" class="product-price">{{ formatPrice(prod.precio) }}</span>
        </div>
        <span *ngIf="isProductAvailable(prod)" class="product-availability">
          {{ prod.maneja_stock ? (prod.stock || 0) + ' disponibles' : 'En stock' }}
        </span>
        <span *ngIf="!isProductAvailable(prod)" class="product-unavailable">
          Falta stock
        </span>
        <div *ngIf="isOutOfStock(prod) && allowStockAdjustment()" class="restock-controls">
          <input
            type="number"
            class="restock-input"
            min="1"
            [value]="getRestockQuantity(prod)"
            (input)="setRestockQuantity(prod, $any($event.target).value)"
            (click)="$event.stopPropagation()"
          />
          <button
            type="button"
            class="restock-btn"
            (click)="$event.stopPropagation(); onRestockProduct(prod)"
          >
            Reabastecer
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Sin productos -->
  <div *ngIf="productos().length === 0 && !isLoading()" class="empty-state">
    <p>No hay productos disponibles</p>
  </div>

  <!-- Cargando -->
  <div *ngIf="isLoading()" class="loading-state">
    <p>Cargando productos...</p>
  </div>
</div>
