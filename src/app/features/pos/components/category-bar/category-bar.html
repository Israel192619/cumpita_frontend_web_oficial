<nav class="categories" aria-label="Categorías de productos">
  <button type="button" [class.active]="selectedCategoryId() === null && selectedSubcategoryId() === null" (click)="onSelectCategory(null)" [disabled]="isLoading()">Todos</button>
  <button type="button" *ngFor="let category of parentCategorias(); trackBy: trackByCategory" [class.active]="selectedCategoryId() === category.id && selectedSubcategoryId() === null" (click)="onSelectCategory(category.id)" [disabled]="isLoading()">{{ category.nombre }}</button>
</nav>
<nav class="subcategories" *ngIf="expandedCategoryId() !== null && visibleSubcategories().length" aria-label="Subcategorías de productos">
  <button type="button" *ngFor="let category of visibleSubcategories(); trackBy: trackByCategory" [class.active]="selectedSubcategoryId() === category.id" (click)="subcategorySelected.emit(category.id)" [disabled]="isLoading()">{{ category.nombre }}</button>
</nav>
