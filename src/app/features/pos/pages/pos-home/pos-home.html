<div class="pos-container">
  <!-- Error Message -->
  <div *ngIf="error()" class="error-banner">
    <p>{{ error() }}</p>
    <button type="button" class="btn-close-error" (click)="error.set(null)">✕</button>
  </div>

  <!-- Edit Mode Indicator -->
  <div *ngIf="isEditingOrder()" class="edit-mode-banner">
    <div class="edit-mode-content">
      <span class="edit-mode-icon">✎</span>
      <span class="edit-mode-text">Editando Orden #{{ editingOrderId() }}</span>
      <button type="button" class="btn-exit-edit" (click)="onCancelEditMode()">Cancelar</button>
    </div>
  </div>

  <!-- Main Layout: Izquierda (Header + Productos) | Derecha (Carrito) -->
  <div class="pos-layout">
    <!-- Left Column: Header + Productos -->
    <div class="pos-left-column">
      <!-- Header: Categorías + Búsqueda + Marca -->
      <div class="pos-header-section">
        <app-category-bar
          [categorias]="categorias()"
          [selectedCategoryId]="selectedCategoryId()"
          [selectedSubcategoryId]="selectedSubcategoryId()"
          [isLoading]="isLoadingProductos()"
          (categorySelected)="onCategorySelected($event)"
          (subcategorySelected)="onSubcategorySelected($event)"
          (searchChanged)="onProductSearchChanged($event)"
        />
      </div>

      <!-- Productos -->
      <div class="pos-section products-section">
        <app-product-grid
          [productos]="visibleProductos()"
          [isLoading]="isLoadingProductos()"
          (productAdded)="onProductAdded($event)"
          (stockAdjusted)="onStockAdjusted()"
        />
      </div>
    </div>

    <!-- Right Column: Carrito (ocupa toda la altura) -->
    <div class="pos-section cart-section">
      <app-cart-panel
        [items]="carrito()"
        [subtotal]="subtotal()"
        [total]="total()"
        [isProcessing]="isProcessingCheckout()"
        [orderTypeInput]="orderType()"
        [selectedClienteInput]="selectedCliente()"
        [selectedMesaInput]="selectedMesa()"
        [orderDateInput]="orderDate()"
        [stockByProductId]="productStockById()"
        [isEditing]="isEditingOrder()"
        [paidAmount]="pagosTotales()"
        [remainingAmount]="saldoPendiente()"
        [hasPaymentHistory]="orderPayments().length > 0"
        [showHistoryButton]="shouldShowHistoryButton()"
        [isFullyPaid]="isCompletePaidOrder()"
        (quantityChanged)="onQuantityChanged($event)"
        (itemRemoved)="onItemRemoved($event)"  
        (checkoutRequested)="onCheckoutRequested()"
        (payLaterRequested)="onPayLaterRequested()"
        (cartCleared)="onCartCleared()"
        (itemModifiersChanged)="onItemModifiersChanged($event)"
        (modifierBatchApplied)="onModifierBatchApplied($event)"
        (modifierModalClosed)="onModifierModalClosed()"
        (itemNoteChanged)="onItemNoteChanged($event)"
        (orderTypeChanged)="onOrderTypeChanged($event)"
        (orderDateChanged)="onOrderDateChanged($event)"
        (clienteSelected)="selectedCliente.set($event)"
        (mesaSelected)="selectedMesa.set($event)"
        (viewHistoryRequested)="onViewPaymentHistory()"
        (editRequested)="onEditRequested()"
      />

  <div *ngIf="isPaymentHistoryOpen()" class="payment-history-backdrop" (click)="closePaymentHistory()">
    <div class="payment-history-modal" (click)="$event.stopPropagation()">
      <div class="payment-history-header">
        <h2>Historial de pagos</h2>
        <button type="button" class="btn-close" (click)="closePaymentHistory()">✕</button>
      </div>
      <div class="payment-history-body">
        <div *ngIf="orderPayments().length === 0" class="empty-state">
          <p>No hay pagos registrados para esta orden.</p>
        </div>
        <div *ngIf="orderPayments().length > 0" class="payments-list">
          <div *ngFor="let pago of orderPayments()" class="payment-row">
            <div>
              <strong>{{ pago.metodo_pago | uppercase }}</strong> · {{ pago.tipo_pago }}
              <div class="payment-meta">{{ pago.fecha_pago | date:'short' }}</div>
            </div>
            <div class="payment-amounts">
              <span>{{ formatPrice(pago.monto_pagado) }}</span>
              <small *ngIf="pago.cambio_devuelto > 0">Cambio {{ formatPrice(pago.cambio_devuelto) }}</small>
            </div>
          </div>
        </div>
      </div>
      <div class="payment-history-footer">
        <button type="button" class="btn btn-confirm" (click)="closePaymentHistory()">Cerrar</button>
      </div>
    </div>
  </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <app-checkout-modal
    [items]="carrito()"
    [total]="total()"
    [isOpen]="isCheckoutModalOpen()"
    [isProcessing]="isProcessingCheckout()"
    [orderType]="orderType()"
    [clienteId]="selectedCliente()?.id ?? null"
    [mesaId]="selectedMesa()?.id ?? null"
    (checkoutConfirmed)="onCheckoutConfirmed($event)"
    (checkoutCancelled)="onCheckoutCancelled()"
  />
</div>
