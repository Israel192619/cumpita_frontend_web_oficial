<app-filter-bar><app-date-range-picker [value]="dateRange()" (valueChange)="onDateRangeChange($event)" /></app-filter-bar>
<app-data-table
  title="Órdenes"
  [data]="ordenes()"
  [columns]="[
    { key: 'numero_orden', label: 'Número' },
    { key: 'cliente_nombre', label: 'Cliente' },
    { key: 'tipo_orden_label', label: 'Tipo' },
    { key: 'tipo_flujo_label', label: 'Flujo' },
    { key: 'fecha_programada', label: 'Programada', type: 'date' },
    { key: 'estado_preorden_label', label: 'Estado preorden', type: 'status' },
    { key: 'total', label: 'Total' },
    { key: 'estado', label: 'Estado' },
    { key: 'created_at', label: 'Creado', type: 'date' }
  ]"
  [loading]="isLoading()"
  [error]="error()"
  [errorMessageLink]="errorMessageLink()"
  [errorMessageText]="errorMessageText()"
  [rowActions]="rowActions"
  [clickableRows]="true"
  [backendPagination]="true"
  [totalItems]="totalOrders()"
  [currentPage]="currentPage()"
  [pageSize]="pageSize()"
  initialSortKey="created_at"
  initialSortDirection="desc"
  (refresh)="obtenerOrdenes()"
  (queryChange)="onTableQuery($event)"
  (paginationChange)="onPaginationChange($event)"
  (action)="handleAction($event)"
  (rowClick)="verOrden($event)"
>
</app-data-table>

<app-modal [open]="!!selectedOrder()" [title]="'Pedido #' + (selectedOrder()?.numero_orden || selectedOrder()?.id || '')" size="full" panelClass="order-detail-modal" (closed)="closeOrderDetail()">
  <app-orden-show *ngIf="selectedOrder() as order" [orderId]="order.id" />
</app-modal>
